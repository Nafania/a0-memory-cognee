memory_recall_enabled: true
memory_recall_delayed: false
memory_recall_interval: 3
memory_recall_history_len: 10000
memory_recall_memories_max_search: 12
memory_recall_solutions_max_search: 8
memory_recall_memories_max_result: 5
memory_recall_solutions_max_result: 3
memory_recall_similarity_threshold: 0.7
memory_recall_query_prep: true
memory_recall_query_prep_timeout_seconds: 10
memory_recall_timeout_seconds: 180
memory_session_enabled: true
memory_memorize_enabled: true
memory_memorize_consolidation: true
memory_consolidation_timeout_seconds: 30
memory_consolidation_keyword_extraction_enabled: true
memory_consolidation_utility_timeout_seconds: 10
memory_consolidation_idle_seconds: 60
memory_memorize_replace_threshold: 0.9
cognee_debug_enabled: false
cognee_operation_timeout_seconds: 1800
cognee_rebuild_stale_after_seconds: 3600
agent_memory_subdir: default
